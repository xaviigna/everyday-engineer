<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everyday Engineer | Study Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Everyday Engineer (4 Years)</h1>
        <div class="subtitle" id="time-display">Loading...</div>
    </header>

    <div class="stats-container">
        <div class="stat-card">
            <div class="stat-value" id="stat-total">0</div>
            <div class="stat-label">Total Days Studied</div>
        </div>

        <div class="stat-card">
            <div class="stat-value" id="stat-progress">0%</div>
            <div class="stat-label">Degree Progress</div>
        </div>
    </div>

    <div class="years-container" id="grid-container">
    </div>
    
    <script src="script.js"></script>
</body>
</html>
